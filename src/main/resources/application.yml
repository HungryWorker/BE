spring:
  docker:
    compose:
      readiness:
        timeout: 5m

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${PORT:10000}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 604800000

app:
  oauth2:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
  upload:
    dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    org.hibernate.SQL: debug

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
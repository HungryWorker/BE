spring:
  docker:
    compose:
      readiness:
        timeout: 5m

  datasource:
    url: jdbc:sqlserver://localhost:1433;encrypt=false;trustServerCertificate=true
    username: sa
    password: verYs3cret
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# HS256은 최소 32byte(256bit) 이상 시크릿이 필요합니다. 운영 환경에서는 반드시 JWT_SECRET 환경변수로 덮어쓰세요.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 604800000 # 7일

app:
  oauth2:
    # 로그인 성공 후 토큰을 붙여 리다이렉트할 프론트엔드 주소
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
  upload:
    # 리뷰 첨부 사진 등이 저장되는 로컬 디렉터리. "/uploads/**" 로 정적 서빙된다.
    dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    org.hibernate.SQL: debug

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}